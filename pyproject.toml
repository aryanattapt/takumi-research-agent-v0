[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "takumi-research-agent"
version = "0.1.0"
description = "Autonomous bilingual science research and publishing agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
browser = ["browser-use==0.13.14"]
pdf = ["pypdf>=5,<7"]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/takumi_research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
